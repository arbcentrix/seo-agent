# Every scripted check. Fields:
#   id         check function name in seo_agent/checks
#   severity   critical | high | medium | low
#   mode       state = alerts whenever it fires
#              diff  = alerts only on a regression: fires now but not on the previous
#                      snapshot (first run = baseline, no diff alerts)
#              Either way an alert stays open ("ongoing") until the rule stops firing.
#   scope      critical = critical pages only, all = every crawled page
#   threshold  rule-specific numbers
#   watch      true = also run by the publish watch
#   exclude    paths this rule never reports (intentional exceptions)

checks:
  # --- Daily / publish-watch rules -----------------------------------------
  - id: status_change
    severity: critical
    mode: diff
    scope: critical
    watch: true
    description: A critical page stops returning 200, or starts redirecting.

  - id: robots_block
    severity: critical
    mode: diff
    scope: critical
    watch: true
    description: robots.txt adds a Disallow that matches a critical page, or disappears.

  - id: noindex_added
    severity: critical
    mode: diff
    scope: all
    watch: true
    exclude: [/terms, /privacy-policy]   # intentionally noindex (confirmed 2026-10-22)
    description: A page gains noindex (meta robots or X-Robots-Tag).

  - id: canonical_changed
    severity: high
    mode: state
    scope: all
    watch: true
    description: A canonical points somewhere other than the page itself.

  - id: sitemap_drop
    severity: high
    mode: diff
    scope: all
    watch: true
    threshold: {min_urls_lost: 3, min_fraction_lost: 0.10}
    description: The sitemap fails to load, or loses 3+ URLs or 10%+ of URLs.

  - id: title_meta_regression
    severity: high
    mode: diff
    scope: all
    watch: true
    threshold: {brand_only: ["Arbcentrix"]}
    compare: evidence_keys   # regression per field: a newly failing title alerts even if the meta already failed
    description: A title or meta description goes empty, or reverts to the brand-only "Arbcentrix".

  - id: tracking_missing
    severity: high
    mode: state
    scope: critical
    watch: true
    description: The GTM container in site.yaml is missing from a critical page, or a forbidden ID (e.g. GTM-PG3F2KGJ) reappears on any page.

  - id: cta_broken
    severity: high
    mode: state
    scope: critical
    watch: true
    description: The booking link is missing from a booking page, or the form is missing from /contact.

  - id: content_shrink
    severity: medium
    mode: diff
    scope: critical
    watch: true
    threshold: {min_fraction_lost: 0.40}
    description: A critical page loses 40%+ of its words.

  # --- Discovery / technical and on-page checks -----------------------------
  - id: empty_shell
    severity: high
    mode: state
    scope: all
    description: Page returns 200 but its server-rendered HTML has no content (empty #main).

  - id: broken_internal_link
    severity: high
    mode: state
    scope: all
    description: An internal link points at a URL that errors or returns 4xx/5xx.

  - id: orphan_page
    severity: medium
    mode: state
    scope: all
    description: A sitemap URL that no crawled page links to.

  - id: h1_missing
    severity: medium
    mode: state
    scope: all
    description: A content page has no H1.

  - id: h1_multiple
    severity: low
    mode: state
    scope: all
    threshold: {max_distinct: 1}
    description: A page has more than one distinct H1 text.

  - id: canonical_missing
    severity: low
    mode: state
    scope: all
    description: A content page has no canonical link.

  - id: not_in_sitemap
    severity: low
    mode: state
    scope: all
    description: A linked internal page returns 200 but is not in the sitemap.

  - id: thin_content
    severity: low
    mode: state
    scope: all
    threshold: {min_words: 300}
    description: A content page has fewer words than min_words.

# --- Weekly candidate issues (data-driven; computed by `weekly`) -------------
# Windows are the last 28 days of final GSC data vs. the 28 days before.
candidates:
  - id: striking_distance
    description: Query/page ranking just off the top results with real impressions.
    threshold: {min_position: 3.5, max_position: 20, min_impressions: 10, include_branded: false}

  - id: low_ctr
    description: Query/page in the top 3 whose CTR is under half the expected CTR for its position
      (a title/snippet problem). Positions 4-20 are striking_distance (a ranking problem).
    threshold:
      include_branded: false    # branded queries show several site pages, so low CTR is normal
      max_position: 3.5         # exclusive; striking_distance starts at 3.5
      min_impressions: 20
      ratio: 0.5
      expected_ctr: {1: 0.28, 2: 0.15, 3: 0.10}

  - id: page_decline
    description: A page lost clicks against the previous 28 days.
    threshold: {min_clicks_before: 10, min_fraction_lost: 0.30}

  - id: cannibalisation
    description: Several pages split the impressions for one query.
    threshold: {min_impressions: 10, min_share: 0.10, include_branded: false}

  - id: critical_no_impressions
    description: A critical page had no search impressions in the last 28 days.

  - id: psi_poor
    description: Critical pages that are slow, one candidate per device (mobile, desktop). Field (CrUX) data when available, otherwise lab.
    threshold:
      max_lcp_ms: 2500          # field "good" limits
      max_inp_ms: 200
      max_cls: 0.1
      min_lab_performance: 50   # lab, used when there is no field data
      lab_max_lcp_ms: 4000      # Lighthouse "poor"
      lab_max_cls: 0.25

# --- Monthly brief candidates (computed by `monthly`) --------------------------
# Windows are the last 3 complete calendar months vs the 3 before.
monthly_candidates:
  - id: content_gap
    description: A non-branded query with real impressions where the best page ranks off page one.
    threshold: {min_impressions: 5, min_best_position: 10.5}   # low because non-branded volume is small today

  - id: rising_query
    description: A non-branded query whose impressions at least doubled.
    threshold: {min_impressions: 5, min_growth: 2.0}

  - id: declining_page
    description: A page that lost clicks over the last 3 months.
    threshold: {min_clicks_before: 10, min_fraction_lost: 0.30}

  - id: critical_page_flat
    description: A critical page with no clicks in the last 3 months.

# --- Scoring and QA ----------------------------------------------------------
scoring:
  # Priority = (Impact x Relevance x Confidence) / (Effort x Risk), each scored 1-5 by Claude.
  factors: [impact, relevance, confidence, effort, risk]
  intents: [informational, commercial, transactional, navigational, branded]
  approval_levels:
    editor: Copy, titles, meta descriptions, internal links on existing pages
    owner: New pages, page structure, CTAs, anything customer-facing beyond copy
    developer: Framer settings, redirects, robots, sitemap, tracking, performance
