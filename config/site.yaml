domain: arbcentrix.com
base_url: https://arbcentrix.com
user_agent: ArbcentrixSEOAgent/1.0
request_interval_seconds: 1
sitemap_url: https://arbcentrix.com/sitemap.xml
critical_pages:
  - /
  - /services
  - /accounting
  - /audit
  - /tax
  - /contact
  - /about
  - /insights
  - /case-study
  - /customer-care
  - /property-management
  - /recruitment-and-onboarding
  - /digital-transformation
  - /go-to-market-strategy-and-business-development
  - /order-fulfillment-management
tracking:
  gtm_container_id: GTM-N8DDS834
  ga4_measurement_id: G-S55RXL2QCS
  forbidden_ids:        # alert if either ever reappears
    - GTM-PG3F2KGJ
    - G-LEMVN91XBP
cta:
  booking_link: calendly.com/arbcentrix/schedule-a-consultation
  booking_pages:        # pages that carried the booking link on 2026-10-22
    - /
    - /services
    - /accounting
    - /audit
    - /tax
    - /customer-care
    - /property-management
    - /digital-transformation
    - /go-to-market-strategy-and-business-development
    - /order-fulfillment-management
  form_pages:
    - /contact          # form + Calendly popup, no booking link (intended, confirmed 2026-10-22)
brand_terms: [arbcentrix, absentrix, arbcentrix corp]   # queries containing these are branded
sources:
  backfill_months: 16     # GSC keeps 16 months; the first sync backfills all of it
  gsc_lag_days: 3         # sync GSC final data up to today - 3
  gsc_refresh_days: 4     # re-fetch the newest days each run (GSC finalises late)
  ga4_refresh_days: 3
  psi_every_days: 7       # PSI on critical pages, mobile + desktop
schedule:               # the scheduled tasks (README "Schedule"); weekly.json counts runs against this
  daily:   {task: SEO daily watch,    cron: "13 6 * * *",   per_week: 7}
  watch:   {task: SEO publish watch,  cron: "27 */4 * * *", per_week: 42}   # plus API-triggered runs
  weekly:  {task: SEO weekly report,  cron: "43 6 * * 1",   per_week: 1}
  monthly: {task: SEO monthly report, cron: "43 7 3 * *",   per_week: null}  # 3rd of the month
watch:
  # The homepage's own Framer bundles (hashed file names) form the build signature; it
  # changes on every publish. Third-party scripts (events.framer.com, Calendly) are ignored.
  build_asset_pattern: framerusercontent.com/sites/
# monday.com IDs come from MONDAY_BOARD_ID / MONDAY_WORKSPACE_ID (environment)
